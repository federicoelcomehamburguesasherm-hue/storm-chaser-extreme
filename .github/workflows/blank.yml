
name: Build Storm Chaser Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Unity
        run: |
          echo "Preparing Android build environment"

      - name: Check project
        run: |
          unzip -l STORM_CHASER_EXTREME_Unity6_v0.1.zip
          
